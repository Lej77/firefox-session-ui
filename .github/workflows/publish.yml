name: 'release'

on:
  push:
    tags: ['v*']

# This workflow will trigger on each push of a tag that starts with a "v" to create or update a GitHub release, build your app, and upload the artifacts to the release.
# More info at:
# https://tauri.app/distribute/pipelines/github/
# https://github.com/tauri-apps/tauri-action/

jobs:
  # --------------------------------------------------------------------------
  # Build & Release Tauri Bundles (macOS, Windows, Linux .deb/AppImage)
  # --------------------------------------------------------------------------
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown' || 'wasm32-unknown-unknown' }}

      # https://crates.io/crates/cargo-binstall/1.12.3#user-content-in-github-actions
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # https://trunkrs.dev/guide/getting-started/installation.html#using-cargo-binstall
      - name: Install Trunk CLI (using binstall)
        if: matrix.platform != 'macos-latest'
        run: cargo binstall trunk

      # https://trunkrs.dev/guide/getting-started/installation.html#brew
      - name: Install Trunk CLI (using brew for mac)
        if: matrix.platform == 'macos-latest'
        run: brew install trunk

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          args: ${{ matrix.args }}

  # --------------------------------------------------------------------------
  # Build Flatpak Package (Runs in parallel with publish-tauri)
  # --------------------------------------------------------------------------
  build-flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Flatpak
        run: |
          chmod +x ./flatpak/build-flatpak.sh
          ./flatpak/build-flatpak.sh

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-artifact
          path: ./flatpak/firefox-session-data-utility.flatpak
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Download Flatpak Artifact & Attach to GitHub Release
  # --------------------------------------------------------------------------
  publish-flatpak:
    needs: [publish-tauri, build-flatpak]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-artifact

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firefox-session-data-utility.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}