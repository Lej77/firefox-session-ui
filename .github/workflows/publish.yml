name: 'release'

on:
  push:
    tags: ['v*']

# This workflow will trigger on each push of a tag that starts with a "v" to create or update a GitHub release, build your app, and upload the artifacts to the release.
# More info at:
# https://tauri.app/distribute/pipelines/github/
# https://github.com/tauri-apps/tauri-action/

jobs:
  # --------------------------------------------------------------------------
  # Build & Release Tauri Bundles (macOS, Windows, Linux .deb/AppImage)
  # --------------------------------------------------------------------------
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown' || 'wasm32-unknown-unknown' }}

      # https://crates.io/crates/cargo-binstall/1.12.3#user-content-in-github-actions
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # https://trunkrs.dev/guide/getting-started/installation.html#using-cargo-binstall
      - name: Install Trunk CLI (using binstall)
        if: matrix.platform != 'macos-latest'
        run: cargo binstall trunk

      # https://trunkrs.dev/guide/getting-started/installation.html#brew
      - name: Install Trunk CLI (using brew for mac)
        if: matrix.platform == 'macos-latest'
        run: brew install trunk

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          args: ${{ matrix.args }}

  # --------------------------------------------------------------------------
  # Build Flatpak Package (Runs in parallel with publish-tauri)
  # --------------------------------------------------------------------------
  build-flatpak:
    name: "Flatpak (${{ matrix.arch }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Docker CLI for QEMU Setup
        if: ${{ matrix.arch != 'x86_64' }}
        run: |
          curl https://download.docker.com/linux/static/stable/x86_64/docker-26.0.0.tgz --output ./docker.tgz
          tar xzvf docker.tgz
          mv docker/* /usr/bin

      - name: Set up QEMU
        if: ${{ matrix.arch != 'x86_64' }}
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install flatpak-cargo-generator
        run: |
          apt-get update && apt-get install -y pipx jq curl tar
          pipx install flatpak-cargo-generator
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Generate Cargo Sources
        run: |
          chmod +x ./flatpak/generate-sources.sh
          ./flatpak/generate-sources.sh

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/flatpak-builder.yaml
          bundle: firefox-session-data-utility-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          artifact-name: flatpak-artifact-${{ matrix.arch }}
          cache-key: flatpak-builder-${{ github.sha }}

  # --------------------------------------------------------------------------
  # Download Flatpak Artifact & Attach to GitHub Release
  # --------------------------------------------------------------------------
  publish-flatpak:
    needs: [publish-tauri, build-flatpak]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download All Flatpak Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flatpak-artifact-*
          merge-multiple: true

      - name: Upload Flatpaks to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.flatpak"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
